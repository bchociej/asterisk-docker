name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install Python tools from lockfile
        run: uv sync --locked --python 3.12
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck
      - name: Python lint
        run: uv run --locked ruff check .
      - name: Python formatting
        run: uv run --locked ruff format --check .
      - name: Python tests
        run: uv run --locked python -m pytest -m 'not integration'
      - name: Shell lint
        run: shellcheck scripts/*.sh tests/shell/*.bats
      - name: Shell tests
        run: bats tests/shell
