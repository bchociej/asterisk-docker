name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck
      - name: Python lint
        run: ruff check .
      - name: Python formatting
        run: ruff format --check .
      - name: Python tests
        run: python -m pytest -m 'not integration'
      - name: Shell lint
        run: shellcheck scripts/*.sh tests/shell/*.bats
      - name: Shell tests
        run: bats tests/shell
